[package]
name = "oh-hell-app"
description = "Dioxus client (web, desktop, Android) for the Oh Hell scorer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oh-hell-app"
path = "src/main.rs"

[dependencies]
dioxus = { version = "=0.7.6", default-features = false, features = ["launch", "lib"] }
oh-hell-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
android = ["mobile"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oh-hell-server.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Exact pins: wasm-bindgen must match flake.nix's wasm-bindgen-cli_0_2_118, and the rest ship in lockstep with it.
js-sys = "=0.3.95"
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "=0.4.68"
# dioxus-web uses `Location` outside its `devtools` feature without enabling it.
web-sys = { version = "=0.3.95", features = ["Location"] }
