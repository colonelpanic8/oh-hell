name: Deploy web app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: |
          set -euo pipefail
          nix build --impure --expr \
            '(builtins.getFlake (toString ./.)).packages.x86_64-linux.web.override { baseUrl = "/oh-hell"; }'
          mkdir site
          cp -r result/. site/
          chmod -R u+w site
          # Pages serves 404.html for unknown paths, so client routes survive a reload.
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
