name: Deploy site

# Publishes the web app at / and the F-Droid repository at /fdroid on GitHub
# Pages. Runs on every push to master and after each release.

on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_count:
        description: How many recent releases to index in the F-Droid repo.
        required: false
        default: "4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build web app
        run: |
          set -euo pipefail
          nix build --impure --expr \
            '(builtins.getFlake (toString ./.)).packages.x86_64-linux.web.override { baseUrl = "/oh-hell"; }'
          mkdir site
          cp -r result/. site/
          chmod -R u+w site
          # Pages serves 404.html for unknown paths, so client routes survive a reload.
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Check for releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh release list --limit 1 --json tagName --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.releases.outputs.count != '0'
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: steps.releases.outputs.count != '0'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.releases.outputs.count != '0'
        with:
          packages: build-tools;35.0.0

      - name: Build F-Droid repository
        if: steps.releases.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_OUT_DIR: ${{ github.workspace }}/target/fdroid
          FDROID_RELEASE_COUNT: ${{ inputs.release_count || '4' }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check fdroidserver
          ./scripts/fdroid/build-repo.sh
          mkdir -p site/fdroid
          cp -r target/fdroid/repo site/fdroid/repo
          ./scripts/fdroid/landing-page.sh target/fdroid site/fdroid/index.html
          {
            echo "### F-Droid repository"
            echo
            echo "Fingerprint: \`$(cat target/fdroid/fingerprint.txt 2>/dev/null || echo unknown)\`"
            echo
            for apk in site/fdroid/repo/*.apk; do echo "- \`$(basename "$apk")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
