[workspace]
resolver = "3"
members = [
  "crates/oh-hell-core",
  "crates/oh-hell-server",
  "crates/oh-hell-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/colonelpanic8/oh-hell"

[workspace.dependencies]
oh-hell-core = { path = "crates/oh-hell-core" }
oh-hell-server = { path = "crates/oh-hell-server", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
